  <div class="chant" id="chant">ᛞ ∴ ᛟ ∴ ᚱ ∴ ᚦ ∴ ᚨ ∴ ᚠ ∴ ᚾ</div>

<script>
const isMobile = matchMedia('(pointer:coarse)').matches||/Mobi|Android/i.test(navigator.userAgent);
const $ = id => document.getElementById(id);

// ── Autoplay via click-to-start ──────────────────────────────────────────────
(()=>{
  const overlay = $('startOverlay');
  const player = $('scPlayer');
  let started = false;
  const activate = ()=>{
    if(started) return;
    started = true;
    // Load soundcloud player with autoplay after user gesture
    player.addEventListener('load', ()=>{
      // iframe loaded and cross-origin policy satisfied
    }, {once: true});
    player.src = 'https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/mytischi/perseus&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false';
    overlay.classList.add('hidden');
    setTimeout(()=>{ overlay.style.display='none'; }, 900);
    setTimeout(()=>$('wrap').classList.add('on'), 80);
  };
  overlay.addEventListener('click', activate);
  overlay.addEventListener('touchend', e=>{ e.preventDefault(); activate(); }, {passive:false});
})();

// ── Tape counter ─────────────────────────────────────────────────────────────
(()=>{
  let s=0; setInterval(()=>{
    s++; const h=String(s/3600|0).padStart(2,'0'), m=String(s%3600/60|0).padStart(2,'0'), sc=String(s%60).padStart(2,'0');
    $('tc').textContent=`REC ● ${h}:${m}:${sc}`;
  },1000);
})();

// ── WebGL fog with advanced cursor physics ───────────────────────────────────
(()=>{
  const canvas=$('gl'); if(!canvas||!canvas.getContext) return;
  const gl=canvas.getContext('webgl',{antialias:false,powerPreference:'high-performance',premultipliedAlpha:false,alpha:true});
  if(!gl) return;
  const resize=()=>{
    const dpr=Math.min(2,devicePixelRatio||1);
    canvas.width=Math.floor(innerWidth*dpr); canvas.height=Math.floor(innerHeight*dpr);
    canvas.style.cssText=`width:${innerWidth}px;height:${innerHeight}px`;
    gl.viewport(0,0,canvas.width,canvas.height);
  };
  addEventListener('resize',resize,{passive:true}); resize();

  const v=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
  // Enhanced fragment shader with velocity-aware fog distortion
  const f=`precision highp float;
uniform vec2 R,M,MV;uniform float T,G,S,P;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
float n(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),u.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<7;i++){v+=a*n(p);p*=2.1;a*=.48;}return v;}
float fbm2(vec2 p){float v=0.,a=.5;vec2 d=vec2(0);
  for(int i=0;i<5;i++){float ni=n(p);d+=vec2(cos(ni*6.28),sin(ni*6.28))*a;v+=a*n(p+d*0.6);p*=2.;a*=.5;}return v;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float sdC(vec2 p,float r){return length(p)-r;}

void main(){
  vec2 uv=(gl_FragCoord.xy/R)*2.-1.; uv.x*=R.x/R.y;
  // Mouse position: convert from pixel coords to same NDC space as uv
  vec2 m=(M/R)*2.-1.; m.x*=R.x/R.y;
  // Mouse velocity: already in pixels/frame, convert to NDC-scale
  // MV.y is already flipped in JS (WebGL Y is up)
  vec2 mv=MV/R.y*2.0; mv.x*=R.x/R.y;
  float mvLen=length(mv);
  float t=T*.12, dist=length(uv);

  vec2 wind=vec2(sin(T*.08),cos(T*.06))*.06;

  // Vector from this fragment to cursor (in NDC)
  vec2 toMouse=uv-m;
  float mouseD=length(toMouse);

  // 1. Pressure bubble — fog parted radially around cursor
  float bubble=exp(-mouseD*mouseD*3.0)*0.55;
  vec2 radialPush=normalize(toMouse+vec2(0.0001))*bubble;

  // 2. Velocity wake — directional smear in direction of movement
  //    fog in the cursor's path gets pushed forward; behind it gets pulled
  vec2 mvDir=mvLen>0.001?mv/mvLen:vec2(0.);
  float speedFactor=clamp(mvLen*8.0,0.0,2.5);
  // Projection of toMouse onto velocity direction: positive = ahead, negative = behind
  float proj=dot(normalize(toMouse+vec2(0.0001)),mvDir);
  // Ahead of cursor: push forward (compression); behind: drag (wake trail)
  float wakeShape=exp(-mouseD*mouseD*1.2)*(proj*0.5+0.5); // 0..1, peaks ahead
  float trailShape=exp(-mouseD*mouseD*0.5)*(-proj*0.4+0.1);// slight pull from behind
  vec2 velocityForce=mvDir*(wakeShape*0.35+trailShape*0.15)*speedFactor;

  // 3. Swirl / vortex perpendicular to movement (von Karman street effect)
  vec2 perp=vec2(-mvDir.y,mvDir.x);
  float swirlEnvelope=exp(-mouseD*mouseD*2.5)*speedFactor*0.18;
  float swirlPhase=sin(mouseD*12.0-T*3.0)*swirlEnvelope;
  vec2 swirlForce=perp*swirlPhase;

  // 4. Momentum inertia — warp decays over distance, bigger at high speed
  float warpRadius=0.3+speedFactor*0.15;
  float mouseWarp=exp(-mouseD*mouseD/(warpRadius*warpRadius))*(0.4+P*0.6);

  vec2 totalForce=radialPush*0.28+velocityForce+swirlForce;
  vec2 warpedUV=uv+totalForce*mouseWarp+wind;

  // Ring fog: clear at center (sigil visible), density in mid ring, fade at edges
  float centerClear=smoothstep(0.0,0.38,dist);       // 0=transparent at center, ring starts earlier
  float edgeFade=smoothstep(1.05,0.38,dist);          // fade at screen edge
  float radialMask=centerClear*edgeFade;               // fog ring band

  vec2 domainWarp=vec2(fbm(warpedUV*1.1+vec2(t,-t*.8)),fbm(warpedUV*1.1+vec2(-t*.5,t*.6)))*0.5;
  vec2 fw=warpedUV+domainWarp*.7;

  float layer1=fbm2(fw*1.3+vec2(t*.9,-t*.7));
  float layer2=fbm(fw*2.1-vec2(t*.4,t*.5))*0.7;
  float layer3=fbm(fw*.7+domainWarp*.4+vec2(t*.2,-t*.3))*0.5;

  float mousePuff=exp(-mouseD*mouseD*1.2)*(.10+P*.3+clamp(mvLen*3.,0.,1.)*0.15)*centerClear;
  float smoke=(layer1*.52+layer2*.32+layer3*.18+mousePuff)*radialMask;
  smoke=pow(clamp(smoke,0.,1.),0.78)*0.82;

  vec3 col=vec3(0.);
  vec3 deepRed=vec3(.35,.0,.0), midRed=vec3(.72,.03,.03), brightRed=vec3(1.,.12,.08);
  col=mix(vec3(0.),deepRed,smoke*1.2);
  col=mix(col,midRed,pow(smoke,2.0)*radialMask*.55);
  col=mix(col,brightRed,pow(smoke,3.5)*radialMask*.35);

  float gshift=G*(n(vec2(uv.y*50.,T*5.))*2.-1.)*.018;
  col.r+=fbm(fw+vec2(.2,-.1)+gshift)*.07*smoke;
  col.g+=fbm(fw+vec2(.3,-.2)+gshift)*.04*smoke;
  col.b+=fbm(fw-vec2(.1,.4)-gshift)*.03*smoke;

  float stripe=step(.97,fract(uv.y*55.+T*9.))*.07*smoke;
  col.r+=stripe;

  float c1=smoothstep(.53,.5,abs(sdC(uv*rot(T*.15),.5)));
  float c2=smoothstep(.28,.25,abs(sdC(uv*rot(-T*.25),.25)));
  col.r+=clamp(c1+c2,0.,1.)*.22*edgeFade*centerClear;

  if(S>.5){
    float ph=step(.5,fract(T*28.));
    col=mix(col,mix(vec3(1.,.1,.1),vec3(1.),ph),clamp(smoke*0.9,0.,1.));
  }

  col.r*=1.15; col.gb*=.14;
  float vig=smoothstep(1.3,.2,dist); col*=vig;
  col=pow(max(col,vec3(0.)),vec3(.95));
  // Semi-transparent so sigil (on canvas above) shows through
  float fogAlpha=clamp(smoke*1.7,0.,0.91);
  gl_FragColor=vec4(col*fogAlpha,fogAlpha);
}`;

  const compile=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;};
  const prog=gl.createProgram();
  gl.attachShader(prog,compile(gl.VERTEX_SHADER,v));
  gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,f));
  gl.linkProgram(prog); gl.useProgram(prog);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uR=gl.getUniformLocation(prog,'R'), uT=gl.getUniformLocation(prog,'T'),
        uM=gl.getUniformLocation(prog,'M'), uMV=gl.getUniformLocation(prog,'MV'),
        uG=gl.getUniformLocation(prog,'G'),
        uS=gl.getUniformLocation(prog,'S'), uP=gl.getUniformLocation(prog,'P');

  let start=performance.now();
  // Raw mouse in CSS pixels
  let rawX=innerWidth/2, rawY=innerHeight/2;
  // Smoothed mouse position (slight lag = inertia feel)
  let smX=innerWidth/2, smY=innerHeight/2;
  let prevSmX=innerWidth/2, prevSmY=innerHeight/2;
  // Smoothed velocity in CSS pixels / frame
  let velX=0, velY=0;
  let strobe=0, press=0;
  const dpr=Math.min(2,devicePixelRatio||1);

  addEventListener('mousemove',e=>{rawX=e.clientX;rawY=e.clientY;},{passive:true});
  addEventListener('touchmove',e=>{const t=e.touches[0];if(t){rawX=t.clientX;rawY=t.clientY;}},{passive:true});
  if(!isMobile){
    addEventListener('mousedown',()=>{strobe=1;press=1;},{passive:true});
    addEventListener('mouseup',()=>{strobe=0;press=0;},{passive:true});
    addEventListener('mouseleave',()=>{strobe=0;press=0;},{passive:true});
  }

  let pressSmooth=0;
  const draw=()=>{
    const t=(performance.now()-start)/1000;
    pressSmooth+=(press-pressSmooth)*.08;

    // Position: smooth with inertia
    smX += (rawX - smX) * 0.15;
    smY += (rawY - smY) * 0.15;

    // Velocity: delta per frame, smoothed with decay
    const dx = smX - prevSmX;
    const dy = smY - prevSmY;
    velX = velX * 0.75 + dx * 0.25;
    velY = velY * 0.75 + dy * 0.25;
    prevSmX = smX; prevSmY = smY;

    const g=.2*(1+.12*Math.sin(t*.6));

    // Position → WebGL coords (origin bottom-left, Y flipped)
    const glMx = smX * dpr;
    const glMy = (innerHeight - smY) * dpr;
    // Velocity → same pixel scale, Y flipped (moving down in CSS = negative in GL)
    const glVx = velX * dpr;
    const glVy = -velY * dpr; // flip Y: CSS down = GL up negative

    gl.uniform2f(uR,canvas.width,canvas.height);
    gl.uniform1f(uT,t);
    gl.uniform2f(uM, glMx, glMy);
    gl.uniform2f(uMV, glVx, glVy);
    gl.uniform1f(uG,g); gl.uniform1f(uS,strobe); gl.uniform1f(uP,pressSmooth);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    requestAnimationFrame(draw);
  };
  draw();
})();

// ── Canvas FX particles ───────────────────────────────────────────────────────
(()=>{
  const c=$('fx'); if(!c||!c.getContext) return;
  const ctx=c.getContext('2d');
  const resize=()=>{
    const dpr=Math.min(2,devicePixelRatio||1);
    c.width=innerWidth*dpr; c.height=innerHeight*dpr;
    c.style.cssText=`width:${innerWidth}px;height:${innerHeight}px`;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  };
  addEventListener('resize',resize,{passive:true}); resize();

  const G='ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛇ ᛈ ᛉ ᛋ ᛏ ᛒ ᛗ ᛚ ᛝ ᛟ ∴ † ∵ △ ▽ ◯ ☽ ☾ ᛞ'.split(' ');
  const R=n=>Math.random()*n, rnd=()=>Math.random();

  const particles=Array.from({length:55},(_,i)=>({
    x:R(innerWidth), y:R(innerHeight),
    vx:(rnd()-.5)*.4, vy:(rnd()-.5)*.4,
    ax:0, ay:0,
    ch:G[R(G.length)|0],
    s:11+R(16),
    a:0.3+R(0.5),
    rot:R(Math.PI*2),
    vrot:(rnd()-.5)*.012,
    orbitCX:innerWidth/2+((rnd()-.5)*innerWidth*.7),
    orbitCY:innerHeight/2+((rnd()-.5)*innerHeight*.7),
    orbitR:60+R(280),
    orbitSpeed:(rnd()>.5?1:-1)*(0.0003+R(.0008)),
    orbitAngle:R(Math.PI*2),
    orbitStrength:0.4+R(0.5),
    wobbleFreq:0.4+R(.8),
    wobbleAmp:0.3+R(.6),
    lifetime:0, phase:R(Math.PI*2)
  }));

  let mouse={x:innerWidth/2,y:innerHeight/2}, press=0;
  addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;},{passive:true});
  addEventListener('touchmove',e=>{const t=e.touches[0];if(t){mouse.x=t.clientX;mouse.y=t.clientY;}},{passive:true});
  addEventListener('mousedown',()=>press=1,{passive:true});
  addEventListener('mouseup',()=>press=0,{passive:true});

  let last=0;
  const step=ts=>{
    const dt=Math.min((ts-last)/1000,.05); last=ts;
    ctx.clearRect(0,0,innerWidth,innerHeight);

    for(const p of particles){
      p.lifetime+=dt;
      p.orbitAngle+=p.orbitSpeed*(1+press*.4);
      const tx=p.orbitCX+Math.cos(p.orbitAngle)*p.orbitR;
      const ty=p.orbitCY+Math.sin(p.orbitAngle)*p.orbitR*0.6;
      const fx=(tx-p.x)*p.orbitStrength*.015;
      const fy=(ty-p.y)*p.orbitStrength*.015;
      const dx=mouse.x-p.x, dy=mouse.y-p.y;
      const md=Math.sqrt(dx*dx+dy*dy)+1;
      const mf=press ? 80 : 20;
      const mfac=mf/(md*md+200);
      p.ax=fx+(press ? dx*mfac : -dx*mfac*.3);
      p.ay=fy+(press ? dy*mfac : -dy*mfac*.3);
      p.vx=(p.vx+p.ax*dt)*.994;
      p.vy=(p.vy+p.ay*dt)*.994;
      p.vx+=Math.sin(p.lifetime*p.wobbleFreq+p.phase)*p.wobbleAmp*dt*.3;
      p.vy+=Math.cos(p.lifetime*p.wobbleFreq*0.7+p.phase)*p.wobbleAmp*dt*.3;
      p.x+=p.vx; p.y+=p.vy;
      p.rot+=p.vrot;
      if(p.x<-60)p.x=innerWidth+40;
      if(p.x>innerWidth+60)p.x=-40;
      if(p.y<-60)p.y=innerHeight+40;
      if(p.y>innerHeight+60)p.y=-40;
      const pulse=.7+.3*Math.sin(p.lifetime*1.2+p.phase);
      const alpha=p.a*pulse;
      const cx=innerWidth/2, cy=innerHeight/2;
      const ddx=p.x-cx, ddy=p.y-cy;
      const screenDist=Math.sqrt(ddx*ddx+ddy*ddy)/Math.sqrt(cx*cx+cy*cy);
      const fadeEdge=1-screenDist*.5;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.font=`${p.s}px ui-monospace,monospace`;
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.shadowColor='rgba(255,0,0,.6)';
      ctx.shadowBlur=6+4*pulse;
      ctx.fillStyle=`rgba(255,${20+press*30},${press*20},${alpha*fadeEdge})`;
      ctx.fillText(p.ch,0,0);
      ctx.restore();
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
})();

// ── VHS glitch layer ─────────────────────────────────────────────────────────
(()=>{
  const c=$('vhs'); if(!c||!c.getContext) return;
  const ctx=c.getContext('2d');
  const resize=()=>{
    const dpr=1;
    c.width=innerWidth*dpr; c.height=innerHeight*dpr;
    c.style.cssText=`width:${innerWidth}px;height:${innerHeight}px`;
  };
  addEventListener('resize',resize,{passive:true}); resize();

  let T=0;
  const step=()=>{
    T+=.016;
    ctx.clearRect(0,0,innerWidth,innerHeight);
    const glitchTime=Math.sin(T*.13)*Math.sin(T*.37);
    if(Math.abs(glitchTime)>.7){
      const numBands=2+Math.floor(Math.random()*3);
      for(let i=0;i<numBands;i++){
        const y=Math.random()*innerHeight;
        const h=1+Math.random()*4;
        const shift=(Math.random()-.5)*8;
        ctx.drawImage(c,0,y,innerWidth,h,shift,y,innerWidth,h);
        ctx.fillStyle=`rgba(0,255,255,${.04+Math.random()*.06})`;
        ctx.fillRect(0,y,innerWidth,h);
      }
    }
    if(Math.random()<.008){
      const y=Math.random()*innerHeight;
      const h=Math.random()*30;
      ctx.fillStyle=`rgba(255,0,0,${.05+Math.random()*.1})`;
      ctx.fillRect(0,y,innerWidth,h);
    }
    const noise=ctx.createImageData(innerWidth,6);
    const nd=noise.data;
    for(let i=0;i<nd.length;i+=4){
      const v=Math.random()<.5?0:255;
      nd[i]=nd[i+1]=nd[i+2]=v;
      nd[i+3]=Math.random()*18;
    }
    const ny=(T*innerHeight*.3)%innerHeight;
    ctx.putImageData(noise,0,ny|0);
    requestAnimationFrame(step);
  };
  step();
})();

// ── Rune chant cycler ────────────────────────────────────────────────────────
(()=>{
  const el=$('chant');
  const seq=['ᚠᚢᚦ ∴ ᛞᛟᚱ ∴ ᚨᚾᚠ','ᛉᛉᛉ ∴ ᚹᚺᛁᛏᚳ ∴ ᚻᚩᚢᛋᛖ','ᛞ ∴ ᛟ ∴ ᚱ ∴ ᚦ ∴ ᚨ ∴ ᚠ ∴ ᚾ','ᛞᛖᚨᛞᚱᚨᛉ ∴ ᛗᚨᚾ1ᚳ','ᚹᛁᛏᚳᚺ ∴ ᛞᚨᚱᚳᚹᚨᚢᛖ','ᛗᚨᚾᛁᚳ ∴ ᚲᛁᛉᛁᛚ ∴ ᛋᚺᚨᛞᛟᚹ'];
  let i=0; setInterval(()=>{i=(i+1)%seq.length;el.textContent=seq[i];},220);
})();

// ── Noise canvas ─────────────────────────────────────────────────────────────
(()=>{
  const canvas=$('noiseLayer');
  if(!canvas||!canvas.getContext) return;
  canvas.style.cssText='position:fixed;inset:0;z-index:13;pointer-events:none;width:100%;height:100%';
  canvas.width=256; canvas.height=256;
  const ctx=canvas.getContext('2d');
  const step=()=>{
    const d=ctx.createImageData(256,256);
    for(let i=0;i<d.data.length;i+=4){
      const v=Math.random()*255|0;
      d.data[i]=d.data[i+1]=d.data[i+2]=v;
      d.data[i+3]=Math.random()*22|0;
    }
    ctx.putImageData(d,0,0);
    setTimeout(step,50);
  };
  step();
})();
