  <style>
    @font-face {
      font-family: 'VCR OSD Mono';
      src: url('/vcrosdmonorus_vhsicons.ttf') format('truetype');
      unicode-range: U+0400-04FF, U+0500-052F, U+1C80-1C8F, U+2DE0-2DFF, U+A640-A69F;
      font-display: swap
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --black: #000;
      --white: #fff;
      --red: #b52626;
      --font-vhs: 'VCR OSD Mono', 'Courier New', monospace;
      --font-nav: 'Arial Black', Arial, sans-serif;
      --site-pad: clamp(16px, 4vw, 40px)
    }

    html {
      background: #000;
      -webkit-text-size-adjust: 100%
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font-vhs);
      min-height: 100dvh;
      overflow-x: hidden;
      cursor: default;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5
    }

    ::selection {
      background: #fff;
      color: #000;
      text-shadow: none
    }

    a {
      color: inherit
    }

    /* ── VHS FX ── */
    .fx-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .13;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.05' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 64px;
      animation: grainFlicker .16s steps(1) infinite;
      contain: paint
    }

    @keyframes grainFlicker {
      0% {
        background-position: 0 0
      }

      12% {
        background-position: -37px 19px
      }

      24% {
        background-position: 22px -41px
      }

      36% {
        background-position: -14px -8px
      }

      48% {
        background-position: 41px 27px
      }

      60% {
        background-position: -29px 44px
      }

      72% {
        background-position: 8px -23px
      }

      84% {
        background-position: -46px -35px
      }

      100% {
        background-position: 33px 6px
      }
    }

    .glitch-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: screen
    }

    .vhs-filter {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      background: radial-gradient(ellipse at 50% 50%, transparent 62%, rgba(0, 0, 0, .3) 100%);
      mix-blend-mode: multiply
    }

    .glitch-line {
      position: absolute;
      width: 100%;
      height: 2px;
      opacity: 0;
      background: linear-gradient(90deg, var(--gl-color, #fff), transparent);
      animation: glitchLine 100ms linear
    }

    @keyframes glitchLine {
      0% {
        transform: translateX(-100%);
        opacity: 0
      }

      10%,
      90% {
        opacity: .35
      }

      to {
        transform: translateX(100%);
        opacity: 0
      }
    }

    .glitch-flash {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, .02);
      pointer-events: none;
      opacity: 0;
      z-index: 2;
      animation: flash 150ms linear;
      mix-blend-mode: screen
    }

    @keyframes flash {

      0%,
      to {
        opacity: 0
      }

      50% {
        opacity: .15
      }
    }

    .fx-tracking {
      position: fixed;
      left: 0;
      top: -6px;
      width: 100%;
      height: 6px;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(90deg, transparent 5%, rgba(255, 255, 255, .025) 40%, rgba(181, 38, 38, .05) 50%, rgba(255, 255, 255, .025) 60%, transparent 95%);
      animation: trackSweep 9s linear infinite
    }

    @keyframes trackSweep {
      0% {
        transform: translateY(0);
        opacity: 0
      }

      3% {
        opacity: .18
      }

      96% {
        opacity: .18
      }

      100% {
        transform: translateY(calc(100vh + 12px));
        opacity: 0
      }
    }

    .fx-tearline {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 2px;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      background: rgba(255, 255, 255, .1);
      animation: tearFlash 5.5s step-end infinite
    }

    @keyframes tearFlash {

      0%,
      100% {
        opacity: 0;
        transform: translateY(30vh)
      }

      32% {
        opacity: .3;
        transform: translateY(62vh)
      }

      34% {
        opacity: 0
      }

      71% {
        opacity: .3;
        transform: translateY(18vh)
      }

      73% {
        opacity: 0
      }
    }

    .fx-chromab {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      animation: chromabAmbient 7s step-end infinite
    }

    @keyframes chromabAmbient {

      0%,
      100% {
        opacity: 0
      }

      32% {
        opacity: 1;
        box-shadow: inset 2px 0 0 rgba(181, 38, 38, .05), inset -2px 0 0 rgba(255, 255, 255, .035)
      }

      34% {
        opacity: 0
      }

      67% {
        opacity: 1;
        box-shadow: inset -2px 0 0 rgba(181, 38, 38, .04), inset 2px 0 0 rgba(255, 255, 255, .03)
      }

      69% {
        opacity: 0
      }
    }

    /* ── NAV ── */
    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 58px;
      padding: 0 var(--site-pad);
      background: rgba(0, 0, 0, .14);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-bottom: 1px solid rgba(255, 255, 255, .05);
      transition: background .3s ease, border-color .3s ease
    }

    .site-nav.scrolled {
      background: rgba(0, 0, 0, .5);
      border-bottom-color: rgba(181, 38, 38, .18)
    }

    .nav-wordmark-link {
      display: flex;
      align-items: center;
      flex-shrink: 0
    }

    .nav-wordmark {
      height: 19px;
      width: auto;
      filter: brightness(0) invert(1);
      transition: filter .2s ease
    }

    .nav-wordmark-link:hover .nav-wordmark,
    .nav-wordmark-link:focus-visible .nav-wordmark {
      filter: brightness(0) invert(1) drop-shadow(0 0 5px rgba(181, 38, 38, .6))
    }

    .nav-group {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      gap: clamp(16px, 2.4vw, 32px)
    }

    .nav-group a {
      font-family: var(--font-nav);
      font-weight: 900;
      text-decoration: none;
      font-size: 11.5px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, .7);
      transition: color .2s ease
    }

    .nav-group a:hover,
    .nav-group a:focus-visible {
      color: var(--red)
    }

    .nav-group a.nav-active {
      color: #fff
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0
    }

    .minigame-btn {
      display: none;
      width: 30px;
      height: 30px;
      align-items: center;
      justify-content: center;
      text-decoration: none
    }

    .minigame-btn img {
      width: 17px;
      height: 19px;
      filter: brightness(0) invert(1);
      transition: filter .2s ease
    }

    .minigame-btn:hover img,
    .minigame-btn:focus-visible img {
      filter: brightness(0) saturate(100%) invert(15%) sepia(90%) saturate(6000%) hue-rotate(350deg)
    }

    .menu-toggle {
      width: 30px;
      height: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer
    }

    .menu-toggle span {
      display: block;
      width: 20px;
      height: 2px;
      background: #fff;
      transition: transform .25s ease, opacity .2s ease, background .2s ease
    }

    .menu-toggle.open span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
      background: var(--red)
    }

    .menu-toggle.open span:nth-child(2) {
      opacity: 0
    }

    .menu-toggle.open span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
      background: var(--red)
    }

    @media(min-width:861px) {
      .nav-group {
        display: flex
      }

      .minigame-btn {
        display: flex
      }

      .menu-toggle {
        display: none
      }
    }

    /* ── MOBILE MENU ── */
    .mobile-menu {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: #030303;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 4vh, 32px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: opacity .25s ease, transform .25s ease, visibility 0s linear .25s
    }

    .mobile-menu.open {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity .25s ease, transform .25s ease
    }

    .mobile-links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(14px, 3.5vh, 26px)
    }

    .mobile-links a {
      font-family: var(--font-nav);
      font-weight: 900;
      text-decoration: none;
      font-size: clamp(18px, 5.2vw, 27px);
      letter-spacing: 1px;
      color: #fff;
      transition: color .2s ease
    }

    .mobile-links a:hover,
    .mobile-links a:active,
    .mobile-links a:focus-visible {
      color: var(--red)
    }

    .menu-close {
      position: absolute;
      top: clamp(14px, 3.5vw, 26px);
      right: clamp(14px, 3.5vw, 26px);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid rgba(255, 255, 255, .25);
      cursor: pointer;
      transition: border-color .2s ease, transform .3s cubic-bezier(.34, 1.56, .64, 1)
    }

    .menu-close span {
      position: absolute;
      width: 16px;
      height: 2px;
      background: #fff;
      transition: background .2s ease
    }

    .menu-close span:nth-child(1) {
      transform: rotate(45deg)
    }

    .menu-close span:nth-child(2) {
      transform: rotate(-45deg)
    }

    .menu-close:hover,
    .menu-close:focus-visible {
      border-color: var(--red);
      transform: rotate(90deg)
    }

    .menu-close:hover span,
    .menu-close:focus-visible span {
      background: var(--red)
    }

    @keyframes closeSpinIn {
      from {
        transform: rotate(-90deg) scale(.4);
        opacity: 0
      }

      to {
        transform: rotate(0deg) scale(1);
        opacity: 1
      }
    }

    .mobile-menu.open .menu-close {
      animation: closeSpinIn .4s cubic-bezier(.34, 1.56, .64, 1) both
    }

    /* ── LOADING BAR ── */
    .loading-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(122, 16, 16, .8) 20%, var(--red) 50%, rgba(122, 16, 16, .8) 80%, transparent);
      box-shadow: 0 0 20px rgba(181, 38, 38, .7), 0 0 40px rgba(122, 16, 16, .5);
      z-index: 9999;
      opacity: 0;
      filter: blur(.5px);
      transition: width .4s cubic-bezier(.4, 0, .2, 1);
      will-change: width
    }

    .loading-bar.active {
      opacity: 1;
      animation: pulseBar 2s ease-in-out infinite
    }

    .loading-bar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg, transparent 0, rgba(181, 38, 38, .3) 2px, transparent 4px);
      animation: barScan .5s linear infinite
    }

    .loading-bar::after {
      content: '';
      position: absolute;
      top: -1px;
      right: 0;
      width: 150px;
      height: 5px;
      background: radial-gradient(ellipse at center, var(--red), rgba(181, 38, 38, .4) 40%, transparent 70%);
      filter: blur(3px);
      animation: glowPulse 1.5s ease-in-out infinite
    }

    @keyframes pulseBar {

      0%,
      to {
        filter: blur(.5px) brightness(1)
      }

      50% {
        filter: blur(.8px) brightness(1.3)
      }
    }

    @keyframes barScan {
      to {
        transform: translateX(100%)
      }
    }

    @keyframes glowPulse {

      0%,
      to {
        opacity: .6;
        transform: scaleX(1)
      }

      50% {
        opacity: 1;
        transform: scaleX(1.2)
      }
    }

    /* ── BOOT FLASH ── */
    .boot-flash {
      position: fixed;
      inset: 0;
      z-index: 70;
      pointer-events: none;
      background: #fff;
      mix-blend-mode: screen;
      animation: bootFlash .55s ease-out both
    }

    @keyframes bootFlash {
      0% {
        opacity: .5
      }

      12% {
        opacity: .12
      }

      30% {
        opacity: .28
      }

      55% {
        opacity: .05
      }

      100% {
        opacity: 0
      }
    }

    /* ── CRT OPEN ── */
    .legal-wrap {
      animation: crtOn 1s cubic-bezier(.2, .7, .2, 1) both;
      transform-origin: center center;
      will-change: transform, filter, opacity
    }

    @keyframes crtOn {
      0% {
        opacity: 0;
        transform: scaleY(.006) scaleX(1.35);
        filter: brightness(8) contrast(2.2)
      }

      9% {
        opacity: 1;
        transform: scaleY(.006) scaleX(1.35);
        filter: brightness(6)
      }

      15% {
        transform: scaleY(.03) scaleX(1.2);
        filter: brightness(4.5)
      }

      23% {
        transform: scaleY(.5) scaleX(1.03);
        filter: brightness(2.8)
      }

      31% {
        transform: scaleY(1.07) scaleX(1);
        filter: brightness(2)
      }

      37% {
        transform: scaleY(.97);
        filter: brightness(1.5)
      }

      44% {
        transform: translateX(-7px) skewX(-1.2deg);
        filter: brightness(1.8) contrast(1.3)
      }

      50% {
        transform: translateX(6px) skewX(.8deg);
        filter: brightness(1.2)
      }

      58% {
        transform: translateX(-4px);
        filter: brightness(1.4)
      }

      67% {
        transform: translateX(3px) skewX(-.4deg)
      }

      80% {
        transform: none;
        filter: brightness(1.05)
      }

      100% {
        opacity: 1;
        transform: none;
        filter: none
      }
    }

    /* ── LAYOUT ── */
    .legal-wrap {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: flex;
      flex-direction: column
    }

    .legal-main {
      flex: 1 1 auto;
      padding: clamp(78px, 11vh, 110px) var(--site-pad) clamp(40px, 6vh, 70px)
    }

    .legal-inner {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      animation: revealUp .55s cubic-bezier(.2, .7, .2, 1) .5s both
    }

    @keyframes revealUp {
      0% {
        opacity: 0;
        transform: translateY(16px)
      }

      55% {
        opacity: 0;
        transform: translateY(6px)
      }

      70% {
        opacity: 1;
        transform: translateX(-2px)
      }

      82% {
        transform: translateX(2px)
      }

      100% {
        opacity: 1;

    /* ── FOOTER ── */

    }

    }

    }

      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important
      }
    }
