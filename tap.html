var pl=document.getElementById('pl'),plFL=document.getElementById('plFL'),plFill=document.getElementById('plFill'),plStatus=document.getElementById('plStatus'),lb=document.getElementById('lb'),lbProg=0,lbIv=null,finished=false;
var sec=0,tIv=setInterval(function(){sec++;var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60,p=function(n){return(n<10?'0':'')+n};if(plStatus)plStatus.textContent='▶ REC \u00a0\u00a0 SP \u00a0\u00a0 '+p(h)+':'+p(m)+':'+p(s)},1000);
var prog=0,pIv=setInterval(function(){prog+=Math.random()<.1?Math.random()*20:Math.random()*8+1;if(prog>100)prog=100;if(plFill)plFill.style.width=prog+'%';if(prog>=100)clearInterval(pIv)},220);
function finish(){if(finished)return;finished=true;clearInterval(tIv);clearInterval(pIv);if(plFill)plFill.style.width='100%';if(plStatus)plStatus.textContent='▶ REC \u00a0\u00a0 SP \u00a0\u00a0 00:00:00';setTimeout(function(){if(plFL)plFL.classList.add('on');setTimeout(function(){if(pl)pl.classList.add('done');setTimeout(function(){if(pl)pl.style.display='none'},600)},420)},120)}
var minPassed=false,loaded=false;
setTimeout(function(){minPassed=true;if(loaded)finish()},1000);
window.addEventListener('load',function(){loaded=true;if(minPassed)finish()});
setTimeout(function(){if(!finished)finish()},2000);
window.addEventListener('pageshow',function(e){if(e.persisted&&lb){lb.classList.remove('on');lb.style.width='0'}});
function lbGo(){if(!lb)return;lb.classList.add('on');lbProg=0;lb.style.width='0';clearInterval(lbIv);lbIv=setInterval(function(){lbProg<70?lbProg+=Math.random()*10:lbProg<90?lbProg+=Math.random()*3:lbProg<95&&(lbProg+=.5);lb.style.width=Math.min(lbProg,95)+'%';if(lbProg>=95)clearInterval(lbIv)},100)}
function lbDone(){clearInterval(lbIv);if(!lb)return;lb.style.width='100%';setTimeout(function(){lb.classList.remove('on');setTimeout(function(){lb.style.width='0'},300)},200)}
lbGo();
window.addEventListener('load',lbDone);
document.addEventListener('click',function(e){var a=e.target;while(a&&a.tagName!=='A')a=a.parentElement;if(!a||a.target==='_blank')return;try{if(a.hostname&&a.hostname!==location.hostname)return}catch(ex){}var h=a.getAttribute('href');if(!h||h[0]==='#'||h.substring(0,7)==='mailto:')return;lbGo()});
(function(){var bg=document.querySelectorAll('.bg-g,.bg-n,.bg-hl,.bg-hl2,.bg-ca,.bg-tl,.bg-gl,.bg-dt,.bg-sh,.vhs-back,.vhs-rgb,.vhs-trk,.vhs-front');function pause(){bg.forEach(function(el){el.style.animationPlayState='paused';el.querySelectorAll('*').forEach(function(c){c.style.animationPlayState='paused'})})}function resume(){bg.forEach(function(el){el.style.animationPlayState='running';el.querySelectorAll('*').forEach(function(c){c.style.animationPlayState='running'})})}document.addEventListener('visibilitychange',function(){if(document.hidden)pause();else resume()})})();
})();
</script>
