(function(){var b=document.getElementById('lb'),p=0,iv=null;function go(){b.classList.add('on');p=0;b.style.width='0';iv=setInterval(function(){if(p<70)p+=Math.random()*10;else if(p<90)p+=Math.random()*3;else if(p<95)p+=.5;b.style.width=Math.min(p,95)+'%';if(p>=95)clearInterval(iv)},100)}function done(){clearInterval(iv);b.style.width='100%';setTimeout(function(){b.classList.remove('on');setTimeout(function(){b.style.width='0'},300)},200)}go();window.addEventListener('load',done);window.addEventListener('pageshow',function(e){if(e.persisted)done()});document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a||a.target==='_blank')return;if(a.hostname&&a.hostname!==location.hostname)return;var h=a.getAttribute('href')||'';if(h==='#'||h.startsWith('#'))return;go()});var w=document.getElementById('pw'),t=0;w.addEventListener('touchstart',function(){t=Date.now()});w.addEventListener('click',function(e){if(e.target.closest('#cb'))return;if('ontouchstart'in window&&Date.now()-t>300)return;location.href='/'})})();
(function(){var bg=document.querySelectorAll('.bg-g,.bg-n,.bg-h,.bg-c,.bg-t,.jp');function pause(){bg.forEach(function(el){el.style.animationPlayState='paused';el.querySelectorAll('*').forEach(function(c){c.style.animationPlayState='paused'})})}function resume(){bg.forEach(function(el){el.style.animationPlayState='running';el.querySelectorAll('*').forEach(function(c){c.style.animationPlayState='running'})})}document.addEventListener('visibilitychange',function(){document.hidden?pause():resume()})})();
</script>
<script src="/global.js" defer></script>
</body>
</html>
