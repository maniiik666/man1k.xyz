  <style>
    @font-face {
      font-family: 'VCR OSD Mono';
      src: url('/vcrosdmonorus_vhsicons.ttf') format('truetype');
      unicode-range: U+0400-04FF, U+0500-052F, U+1C80-1C8F, U+2DE0-2DFF, U+A640-A69F;
      font-display: swap
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --black: #000;
      --white: #fff;
      --red: #b52626;
      --font-vhs: 'VCR OSD Mono', 'Courier New', monospace;
      --font-nav: 'Arial Black', Arial, sans-serif;
      --site-pad: clamp(16px, 4vw, 40px);
      --gap: 6px
    }

    html {
      background: #000;
      -webkit-text-size-adjust: 100%
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font-vhs);
      min-height: 100dvh;
      overflow-x: hidden;
      cursor: default;
      -webkit-font-smoothing: antialiased
    }

    ::selection {
      background: #fff;
      color: #000;
      text-shadow: none
    }

    a {
      color: inherit
    }

    /* ── VHS FX ── */
    .fx-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .13;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.05' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 64px;
      animation: grainFlicker .16s steps(1) infinite;
      contain: paint
    }

    @keyframes grainFlicker {
      0% {
        background-position: 0 0
      }

      12% {
        background-position: -37px 19px
      }

      24% {
        background-position: 22px -41px
      }

      36% {
        background-position: -14px -8px
      }

      48% {
        background-position: 41px 27px
      }

      60% {
        background-position: -29px 44px
      }

      72% {
        background-position: 8px -23px
      }

      84% {
        background-position: -46px -35px
      }

      100% {
        background-position: 33px 6px
      }
    }

    .glitch-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: screen
    }

    .vhs-filter {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      background: radial-gradient(ellipse at 50% 50%, transparent 62%, rgba(0, 0, 0, .3) 100%);
      mix-blend-mode: multiply
    }

    .glitch-line {
      position: absolute;
      width: 100%;
      height: 2px;
      opacity: 0;
      background: linear-gradient(90deg, var(--gl-color, #fff), transparent);
      animation: glitchLine 100ms linear
    }

    @keyframes glitchLine {
      0% {
        transform: translateX(-100%);
        opacity: 0
      }

      10%,
      90% {
        opacity: .35
      }

      to {
        transform: translateX(100%);
        opacity: 0
      }
    }

    .glitch-flash {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, .02);
      pointer-events: none;
      opacity: 0;
      z-index: 2;
      animation: flash 150ms linear;
      mix-blend-mode: screen
    }

    @keyframes flash {

      0%,
      to {
        opacity: 0
      }

      50% {
        opacity: .15
      }
    }

    .fx-tracking {
      position: fixed;
      left: 0;
      top: -6px;
      width: 100%;
      height: 6px;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(90deg, transparent 5%, rgba(255, 255, 255, .025) 40%, rgba(181, 38, 38, .05) 50%, rgba(255, 255, 255, .025) 60%, transparent 95%);
      animation: trackSweep 9s linear infinite
    }

    @keyframes trackSweep {
      0% {
        transform: translateY(0);
        opacity: 0
      }

      3% {
        opacity: .18
      }

      96% {
        opacity: .18
      }

      100% {
        transform: translateY(calc(100vh + 12px));
        opacity: 0
      }
    }

    .fx-tearline {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 2px;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      background: rgba(255, 255, 255, .1);
      animation: tearFlash 5.5s step-end infinite
    }

    @keyframes tearFlash {

      0%,
      100% {
        opacity: 0;
        transform: translateY(30vh)
      }

      32% {
        opacity: .3;
        transform: translateY(62vh)
      }

      34% {
        opacity: 0
      }

      71% {
        opacity: .3;
        transform: translateY(18vh)
      }

      73% {
        opacity: 0
      }
    }

    .fx-chromab {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      animation: chromabAmbient 7s step-end infinite
    }

    @keyframes chromabAmbient {

      0%,
      100% {
        opacity: 0
      }

      32% {
        opacity: 1;
        box-shadow: inset 2px 0 0 rgba(181, 38, 38, .05), inset -2px 0 0 rgba(255, 255, 255, .035)
      }

      34% {
        opacity: 0
      }

      67% {
        opacity: 1;
        box-shadow: inset -2px 0 0 rgba(181, 38, 38, .04), inset 2px 0 0 rgba(255, 255, 255, .03)
      }

      69% {
        opacity: 0
      }
    }

    /* ── NAV ── */
    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 58px;
      padding: 0 var(--site-pad);
      background: rgba(0, 0, 0, .14);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-bottom: 1px solid rgba(255, 255, 255, .05);
      transition: background .3s ease, border-color .3s ease
    }

    .site-nav.scrolled {
      background: rgba(0, 0, 0, .5);
      border-bottom-color: rgba(181, 38, 38, .18)
    }

    .nav-wordmark-link {
      display: flex;
      align-items: center;
      flex-shrink: 0
    }

    .nav-wordmark {
      height: 19px;
      width: auto;
      filter: brightness(0) invert(1);
      transition: filter .2s ease
    }

    .nav-wordmark-link:hover .nav-wordmark,
    .nav-wordmark-link:focus-visible .nav-wordmark {
      filter: brightness(0) invert(1) drop-shadow(0 0 5px rgba(181, 38, 38, .6))
    }

    .nav-group {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      gap: clamp(16px, 2.4vw, 32px)
    }

    .nav-group a {
      font-family: var(--font-nav);
      font-weight: 900;
      text-decoration: none;
      font-size: 11.5px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, .7);
      transition: color .2s ease
    }

    .nav-group a:hover,
    .nav-group a:focus-visible {
      color: var(--red)
    }

    .nav-group a.nav-active {
      color: #fff
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0
    }

    .minigame-btn {
      display: none;
      width: 30px;
      height: 30px;
      align-items: center;
      justify-content: center;
      text-decoration: none
    }

    .minigame-btn img {
      width: 17px;
      height: 19px;
      filter: brightness(0) invert(1);
      transition: filter .2s ease
    }

    .minigame-btn:hover img,
    .minigame-btn:focus-visible img {
      filter: brightness(0) saturate(100%) invert(15%) sepia(90%) saturate(6000%) hue-rotate(350deg)
    }

    .menu-toggle {
      width: 30px;
      height: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer
    }

    .menu-toggle span {
      display: block;
      width: 20px;
      height: 2px;
      background: #fff;
      transition: transform .25s ease, opacity .2s ease, background .2s ease
    }

    .menu-toggle.open span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
      background: var(--red)
    }

    .menu-toggle.open span:nth-child(2) {
      opacity: 0
    }

    .menu-toggle.open span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
      background: var(--red)
    }

    @media(min-width:861px) {
      .nav-group {
        display: flex
      }

      .minigame-btn {
        display: flex
      }

      .menu-toggle {
        display: none
      }
    }

    /* ── MOBILE MENU ── */
    .mobile-menu {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: #030303;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 4vh, 32px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: opacity .25s ease, transform .25s ease, visibility 0s linear .25s
    }

    .mobile-menu.open {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity .25s ease, transform .25s ease
    }

    .mobile-links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(14px, 3.5vh, 26px)
    }

    .mobile-links a {
      font-family: var(--font-nav);
      font-weight: 900;
      text-decoration: none;
      font-size: clamp(18px, 5.2vw, 27px);
      letter-spacing: 1px;
      color: #fff;
      transition: color .2s ease
    }

    .mobile-links a:hover,
    .mobile-links a:active,
    .mobile-links a:focus-visible {
      color: var(--red)
    }

    .menu-close {
      position: absolute;
      top: clamp(14px, 3.5vw, 26px);
      right: clamp(14px, 3.5vw, 26px);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid rgba(255, 255, 255, .25);
      cursor: pointer;
      transition: border-color .2s ease, transform .3s cubic-bezier(.34, 1.56, .64, 1)
    }

    .menu-close span {
      position: absolute;
      width: 16px;
      height: 2px;
      background: #fff;
      transition: background .2s ease
    }

    .menu-close span:nth-child(1) {
      transform: rotate(45deg)
    }

    .menu-close span:nth-child(2) {
      transform: rotate(-45deg)
    }

    .menu-close:hover,
    .menu-close:focus-visible {
      border-color: var(--red);
      transform: rotate(90deg)
    }

    .menu-close:hover span,
    .menu-close:focus-visible span {
      background: var(--red)
    }

    @keyframes closeSpinIn {
      from {
        transform: rotate(-90deg) scale(.4);
        opacity: 0
      }

      to {
        transform: rotate(0deg) scale(1);
        opacity: 1
      }
    }

    .mobile-menu.open .menu-close {
      animation: closeSpinIn .4s cubic-bezier(.34, 1.56, .64, 1) both
    }

    /* ── LOADING BAR ── */
    .loading-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(122, 16, 16, .8) 20%, var(--red) 50%, rgba(122, 16, 16, .8) 80%, transparent);
      box-shadow: 0 0 20px rgba(181, 38, 38, .7), 0 0 40px rgba(122, 16, 16, .5);
      z-index: 9999;
      opacity: 0;
      filter: blur(.5px);
      transition: width .4s cubic-bezier(.4, 0, .2, 1);
      will-change: width
    }

    .loading-bar.active {
      opacity: 1;
      animation: pulseBar 2s ease-in-out infinite
    }

    .loading-bar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg, transparent 0, rgba(181, 38, 38, .3) 2px, transparent 4px);
      animation: barScan .5s linear infinite
    }

    .loading-bar::after {
      content: '';
      position: absolute;
      top: -1px;
      right: 0;
      width: 150px;
      height: 5px;
      background: radial-gradient(ellipse at center, var(--red), rgba(181, 38, 38, .4) 40%, transparent 70%);
      filter: blur(3px);
      animation: glowPulse 1.5s ease-in-out infinite
    }

    @keyframes pulseBar {

      0%,
      to {
        filter: blur(.5px) brightness(1)
      }

      50% {
        filter: blur(.8px) brightness(1.3)
      }
    }

    @keyframes barScan {
      to {
        transform: translateX(100%)
      }
    }

    @keyframes glowPulse {

      0%,
      to {
        opacity: .6;
        transform: scaleX(1)
      }

      50% {
        opacity: 1;
        transform: scaleX(1.2)
      }
    }

    /* ── BOOT FLASH ── */
    .boot-flash {
      position: fixed;
      inset: 0;
      z-index: 70;
      pointer-events: none;
      background: #fff;
      mix-blend-mode: screen;
      animation: bootFlash .55s ease-out both
    }

    @keyframes bootFlash {
      0% {
        opacity: .5
      }

      12% {
        opacity: .12
      }

      30% {
        opacity: .28
      }

      55% {
        opacity: .05
      }

      100% {
        opacity: 0
      }
    }

    /* ── CRT OPEN ── */
    @keyframes crtOn {
      0% {
        opacity: 0;
        transform: scaleY(.006) scaleX(1.35);
        filter: brightness(8) contrast(2.2)
      }

      9% {
        opacity: 1;
        transform: scaleY(.006) scaleX(1.35);
        filter: brightness(6)
      }

      15% {
        transform: scaleY(.03) scaleX(1.2);
        filter: brightness(4.5)
      }

      23% {
        transform: scaleY(.5) scaleX(1.03);
        filter: brightness(2.8)
      }

      31% {
        transform: scaleY(1.07) scaleX(1);
        filter: brightness(2)
      }

      37% {
        transform: scaleY(.97);
        filter: brightness(1.5)
      }

      44% {
        transform: translateX(-7px) skewX(-1.2deg);
        filter: brightness(1.8) contrast(1.3)
      }

      50% {
        transform: translateX(6px) skewX(.8deg);
        filter: brightness(1.2)
      }

      58% {
        transform: translateX(-4px);
        filter: brightness(1.4)
      }

      67% {
        transform: translateX(3px) skewX(-.4deg)
      }

      80% {
        transform: none;
        filter: brightness(1.05)
      }

      100% {
        opacity: 1;
        transform: none;
        filter: none
      }
    }

    /* ── GALLERY LAYOUT ── */
    .gallery-wrap {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      animation: crtOn 1s cubic-bezier(.2, .7, .2, 1) both;
      transform-origin: center center;
      will-change: transform, filter, opacity
    }

    .gallery-main {
      flex: 1 1 auto;
      padding: clamp(70px, 11vh, 92px) clamp(10px, 2.5vw, 24px) clamp(20px, 4vh, 40px);
      width: 100%;
      max-width: 1080px;
      margin: 0 auto
    }

    /* ── PHOTO GRID ── */
    .grid-master {
      display: flex;
      flex-direction: column;
      gap: var(--gap)
    }

    .g-row {
      display: grid;
      grid-template-columns: 2fr 3fr;
      grid-template-rows: clamp(160px, 21vh, 260px) clamp(160px, 21vh, 260px);
      gap: var(--gap)
    }

    .g-row .g-item.vi {
      grid-column: 1;
      grid-row: 1 / 3
    }

    .g-row.rev {
      grid-template-columns: 3fr 2fr
    }

    .g-row.rev .g-item.vi {
      grid-column: 2;
      grid-row: 1 / 3
    }

    .g-row.rev .g-item.hi:nth-child(2) {
      grid-column: 1;
      grid-row: 1
    }

    .g-row.rev .g-item.hi:nth-child(3) {
      grid-column: 1;
      grid-row: 2
    }

    .g-item {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: #0d0d0d;
      display: block;
      outline: none;
      -webkit-tap-highlight-color: transparent
    }

    .g-item.vi {
      grid-row: 1 / 3
    }

    .g-item.hi {
      grid-row: span 1
    }


    .g-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(1) brightness(.65);
      transition: filter .5s ease, transform .55s ease, opacity .4s ease;
      will-change: filter, transform;
      opacity: 0
    }

    .g-item img.loaded {
      opacity: 1
    }

    .g-item:hover img,
    .g-item:focus-visible img {
      filter: grayscale(0) brightness(1);
      transform: scale(1.04)
    }

    .g-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, .5) 100%);
      transition: opacity .4s ease;
      opacity: 1;
      pointer-events: none
    }

    .g-item:hover::after,
    .g-item:focus-visible::after {
      opacity: 0
    }

    .g-item .scan-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(181, 38, 38, .55), transparent);
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      animation: scanMove 1.6s linear infinite;
      animation-play-state: paused;
      transition: opacity .3s
    }

    .g-item:hover .scan-line,
    .g-item:focus-visible .scan-line {
      opacity: 1;
      animation-play-state: running
    }

    @keyframes scanMove {
      0% {
        top: 0
      }

      100% {
        top: 100%
      }
    }

    .g-item:focus-visible {
      outline: 1px solid rgba(181, 38, 38, .5);
      outline-offset: -1px
    }

    @media(hover:none) and (pointer:coarse) {
      .g-item img {
        filter: grayscale(.25) brightness(.8)
      }

      .g-item:active img {
        filter: grayscale(0) brightness(1)
      }

      .g-item:active::after {
        opacity: 0
      }
    }

    /* ── PRESS BAR ── */
    .press-bar {
      padding: clamp(24px, 4vh, 44px) clamp(10px, 2.5vw, 24px) clamp(30px, 5vh, 60px);
      display: flex;
      justify-content: center
    }

    .press-link {
      font-family: var(--font-vhs);
      font-size: clamp(9px, 1.2vw, 10px);
      letter-spacing: 3px;
      color: rgba(255, 255, 255, .18);
      text-decoration: none;
      text-transform: uppercase;
      transition: color .2s ease
    }

    .press-link:hover,
    .press-link:focus-visible {
      color: rgba(255, 255, 255, .45)
    }

    /* ── FOOTER ── */
    .gallery-foot {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      padding: clamp(14px, 3vh, 26px) var(--site-pad) calc(clamp(16px, 3vh, 26px) + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid rgba(255, 255, 255, .06)
    }

    .gallery-foot a {
      display: inline-flex;
      opacity: .45;
      transition: opacity .3s ease
    }

    .gallery-foot a:hover,
    .gallery-foot a:focus-visible {
      opacity: .85
    }

    .gallery-foot img {
      height: 44px;
      width: auto;
      filter: brightness(0) invert(1)
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .97);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all
    }

    .lb-backdrop {
      position: absolute;
      inset: 0;
      cursor: zoom-out
    }

    .lb-img-wrap {
      position: relative;
      z-index: 1;
      max-width: min(92vw, 1280px);
      max-height: calc(100dvh - 80px);
      display: flex;
      align-items: center;
      justify-content: center
    }

    .lb-img-wrap img {
      max-width: 100%;
      max-height: calc(100dvh - 80px);
      object-fit: contain;
      display: block;
      filter: none;
      transition: opacity .18s ease;
      user-select: none;
      -webkit-user-drag: none
    }

    .lb-img-wrap img.lb-loading {
      opacity: 0
    }

    .lb-grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: .055;
      mix-blend-mode: screen;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.05' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 64px;
      animation: grainFlicker .16s steps(1) infinite
    }

    .lb-close {
      position: fixed;
      top: clamp(12px, 2vh, 20px);
      right: clamp(12px, 2vw, 20px);
      z-index: 201;
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255, 255, 255, .3);
      font-family: var(--font-vhs);
      font-size: 20px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .2s ease
    }

    .lb-close:hover,
    .lb-close:focus-visible {
      color: rgba(255, 255, 255, .85)
    }

    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 201;
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255, 255, 255, .15);
      font-family: var(--font-vhs);
      font-size: 26px;
      padding: clamp(12px, 2vw, 20px);
      user-select: none;
      transition: color .2s ease
    }

    .lb-nav:hover,
    .lb-nav:focus-visible {
      color: rgba(255, 255, 255, .65)
    }

    .lb-prev {
      left: 0
    }

    .lb-next {
      right: 0
    }

    .lb-counter {
      position: fixed;
      bottom: clamp(14px, 3vh, 24px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 201;
      font-family: var(--font-vhs);
      font-size: 9px;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, .2);
      text-transform: uppercase;
      white-space: nowrap
    }

    /* ── NOSCRIPT ── */
    .njs-msg {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: clamp(60px, 12vh, 100px) clamp(20px, 5vw, 50px);
      text-align: center
    }

    .njs-title {
      font-family: var(--font-vhs);
      font-size: clamp(11px, 2vw, 14px);
      color: rgba(180, 180, 180, .7);
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1.7
    }

    .njs-links {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center
    }

    .njs-link {
      text-decoration: none;
      color: rgba(180, 180, 180, .6);
      font-family: var(--font-nav);
      font-weight: 900;
      font-size: clamp(10px, 1.8vw, 12px);
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, .1);
      padding: 10px 18px;
      transition: color .2s ease, border-color .2s ease
    }

    .njs-link:hover {
      color: #fff;
      border-color: rgba(181, 38, 38, .5)
    }

    /* ── RESPONSIVE ── */
    @media(max-width:600px) {
      :root {
        --gap: 4px
      }

      .g-row,
      .g-row.rev {
        grid-template-rows: clamp(100px, 16vh, 140px) clamp(100px, 16vh, 140px)
      }

      .gallery-main {
        padding-top: 64px
      }
    }

    @media(max-width:360px) {

      .g-row,
      .g-row.rev {
        grid-template-rows: 95px 95px
      }
    }

    @media(min-width:1400px) {
      .gallery-main {
        max-width: 1280px
      }

      .g-row,
      .g-row.rev {
        grid-template-rows: clamp(260px, 22vh, 320px) clamp(260px, 22vh, 320px)
      }
    }

    @media(max-height:500px) and (orientation:landscape) {

      .g-row,
      .g-row.rev {
        grid-template-rows: 120px 120px
      }

      .gallery-main {
        padding-top: 56px
      }
    }

    @media(max-width:480px) {
      .site-nav {
        height: 52px
      }

      .nav-wordmark {
        height: 15px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important
      }
    }
  </style>

        display: flex !important
      }

        display: none !important
      }

</head>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
    <div class="lb-backdrop" id="lb-backdrop"></div>
    <button class="lb-close" id="lb-close" aria-label="Close photo viewer">✕</button>
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous photo">←</button>
    <div class="lb-img-wrap">
      <img id="lb-img" src="" alt="" loading="eager" decoding="async">
      <div class="lb-grain" aria-hidden="true"></div>
    </div>
    <button class="lb-nav lb-next" id="lb-next" aria-label="Next photo">→</button>
    <div class="lb-counter" id="lb-counter" aria-live="polite"></div>

  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id) };
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;

      /* ── Loading bar ── */
      var loadingBar = $('loadingBar'), lbP = 0, lbIv = null;
      var lbStart = function () {
        clearInterval(lbIv); loadingBar.classList.add('active');
        lbP = 0; loadingBar.style.width = '0';
        lbIv = setInterval(function () {
          if (lbP < 70) lbP += Math.random() * 10;
          else if (lbP < 90) lbP += Math.random() * 3;
          else if (lbP < 95) lbP += .5;
          loadingBar.style.width = Math.min(lbP, 95) + '%';
          if (lbP >= 95) clearInterval(lbIv);
        }, 100);
      };
      var lbDone = function () {
        clearInterval(lbIv);
        loadingBar.style.width = '100%';
        setTimeout(function () {
          loadingBar.classList.remove('active');
          setTimeout(function () { loadingBar.style.width = '0'; }, 300);
        }, 200);
      };
      lbStart();
      window.addEventListener('load', lbDone);
      window.addEventListener('pageshow', function (e) { if (e.persisted) lbDone(); });
      document.addEventListener('click', function (e) {
        var a = e.target.closest('a');
        if (!a || a.target === '_blank') return;
        if (a.hostname && a.hostname !== location.hostname) return;
        var h = a.getAttribute('href') || '';
        if (h.charAt(0) === '#') return;
        lbStart();
      });

      /* ── Nav scroll ── */
      var siteNav = $('siteNav');
      document.addEventListener('scroll', function () {
        siteNav.classList.toggle('scrolled', (window.scrollY || 0) > 20);
      }, { passive: true });

      /* ── Mobile menu ── */
      var menuToggle = $('menuToggle'), mobileMenu = $('mobileMenu'), menuClose = $('menuClose');
      var openMenu = function () {
        mobileMenu.classList.add('open'); menuToggle.classList.add('open');
        menuToggle.setAttribute('aria-expanded', 'true'); document.body.style.overflow = 'hidden';
      };
      var closeMenu = function () {
        mobileMenu.classList.remove('open'); menuToggle.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false'); document.body.style.overflow = '';
      };
      menuToggle.addEventListener('click', function () { mobileMenu.classList.contains('open') ? closeMenu() : openMenu(); });
      menuClose.addEventListener('click', closeMenu);
      mobileMenu.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeMenu); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !lbIsOpen) closeMenu(); });

      /* ── Glitch FX ── */
      if (!reduced) {
        var gc = $('glitch-container'), vis = true;
        document.addEventListener('visibilitychange', function () { vis = !document.hidden; });
        var mkLine = function () {
          if (!vis) return;
          var l = document.createElement('div'); l.className = 'glitch-line';
          l.style.top = Math.random() * 100 + '%';
          l.style.setProperty('--gl-color', Math.random() > .5 ? 'var(--red)' : '#fff');
          gc.appendChild(l); setTimeout(function () { l.remove(); }, 100);
        };
        var mkFlash = function () {
          if (!vis) return;
          var f = document.createElement('div'); f.className = 'glitch-flash';
          document.body.appendChild(f); setTimeout(function () { f.remove(); }, 150);
        };
        var lt = 0, rafId = 0;
        var loop = function (t) {
          if (t - lt >= 16.67 && vis) {
            if (Math.random() < .035) mkLine();
            if (Math.random() < .015) mkFlash();
            lt = t;
          }
          rafId = requestAnimationFrame(loop);
        };
        rafId = requestAnimationFrame(loop);
        document.addEventListener('visibilitychange', function () {
          document.hidden ? cancelAnimationFrame(rafId) : (rafId = requestAnimationFrame(loop));
        });
      }

      /* ── Lazy loader (IntersectionObserver, connection-aware batching) ── */
      var lazyImgs = Array.from(document.querySelectorAll('img.lazy'));
      if (lazyImgs.length) {
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        var isSlow = conn && (conn.effectiveType === 'slow-2g' || conn.effectiveType === '2g' || conn.saveData);
        var BATCH = isSlow ? 2 : 5;
        var rootMargin = isSlow ? '200px 0px' : '700px 0px';
        var queue = [], inFlight = 0;

        var flush = function () {
          while (inFlight < BATCH && queue.length) {
            var img = queue.shift();
            inFlight++;
            (function (im) {
              var s = im.dataset.src;
              if (!s) { inFlight--; flush(); return; }
              var done = function () {
                im.classList.add('loaded');
                im.removeAttribute('data-src');
                inFlight--; flush();
              };
              im.decoding = 'async';
              im.src = s;
              if (im.decode) { im.decode().catch(function () { }).finally(done); }
              else if (im.complete) { done(); }
              else {
                im.addEventListener('load', done, { once: true });
                im.addEventListener('error', done, { once: true });
              }
            })(img);
          }
        };

        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (!e.isIntersecting) return;
            io.unobserve(e.target);
            queue.push(e.target);
            flush();
          });
        }, { rootMargin: rootMargin, threshold: 0 });

        lazyImgs.forEach(function (img) { io.observe(img); });
      }

      /* ── Lightbox ── */
      var items = Array.from(document.querySelectorAll('.g-item[data-src]'));
      var lb = $('lightbox'), lbImg = $('lb-img'), lbCounter = $('lb-counter');
      var lbBackdrop = $('lb-backdrop'), lbClose = $('lb-close');
      var lbPrev = $('lb-prev'), lbNext = $('lb-next');
      var current = 0, lbIsOpen = false, prevFocus = null;

      var preloadAdj = function (idx) {
        [idx - 1, idx + 1].forEach(function (i) {
          if (i >= 0 && i < items.length) {
            var s = items[i].dataset.src;
            if (s) { var im = new Image(); im.src = s; }
          }
        });
      };

      var lbShow = function (idx) {
        current = idx;
        var item = items[idx];
        lbImg.classList.add('lb-loading');
        lbImg.alt = item.dataset.alt || '';
        lbCounter.textContent = (idx + 1) + ' / ' + items.length;
        var tmp = new Image();
        tmp.onload = function () { lbImg.src = tmp.src; lbImg.classList.remove('lb-loading'); };
        tmp.onerror = function () { lbImg.src = item.dataset.src; lbImg.classList.remove('lb-loading'); };
        tmp.src = item.dataset.src;
        preloadAdj(idx);
      };

      var lbOpen = function (idx) {
        lbIsOpen = true; current = idx;
        prevFocus = document.activeElement;
        lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        lbShow(idx); lbClose.focus();
      };

      var lbCloseF = function () {
        lbIsOpen = false;
        lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        if (prevFocus) prevFocus.focus();
      };

      var lbGoPrev = function () { lbShow(current > 0 ? current - 1 : items.length - 1); };
      var lbGoNext = function () { lbShow(current < items.length - 1 ? current + 1 : 0); };

      items.forEach(function (item, i) {
        item.addEventListener('click', function () { lbOpen(i); });
        item.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); lbOpen(i); }
        });
      });

      lbBackdrop.addEventListener('click', lbCloseF);
      lbClose.addEventListener('click', lbCloseF);
      lbPrev.addEventListener('click', function (e) { e.stopPropagation(); lbGoPrev(); });
      lbNext.addEventListener('click', function (e) { e.stopPropagation(); lbGoNext(); });

      document.addEventListener('keydown', function (e) {
        if (!lbIsOpen) return;
        if (e.key === 'Escape') lbCloseF();
        else if (e.key === 'ArrowLeft') lbGoPrev();
        else if (e.key === 'ArrowRight') lbGoNext();
      });

      var touchX = 0;
      lb.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
      lb.addEventListener('touchend', function (e) {
        var dx = e.changedTouches[0].clientX - touchX;
        if (Math.abs(dx) > 50) { dx < 0 ? lbGoNext() : lbGoPrev(); }
      }, { passive: true });
    })();
  </script>
