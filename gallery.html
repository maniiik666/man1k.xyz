*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'VCR OSD Mono';src:local('VCR OSD Mono');font-display:swap}

.lb{position:fixed;top:0;left:0;width:0;height:3px;background:linear-gradient(90deg,transparent,rgba(122,16,16,.8) 20%,var(--r) 50%,rgba(122,16,16,.8) 80%,transparent);box-shadow:0 0 20px rgba(212,32,32,.7),0 0 40px rgba(122,16,16,.5);z-index:9999;opacity:0;filter:blur(.5px);transition:width .4s cubic-bezier(.4,0,.2,1);will-change:width}
.lb.on{opacity:1;animation:lpb 2s ease-in-out infinite}
.lb::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,rgba(212,32,32,.3) 2px,transparent 4px);animation:lbs .5s linear infinite}
.lb::after{content:'';position:absolute;top:-1px;right:0;width:150px;height:5px;background:radial-gradient(ellipse at center,var(--r),rgba(212,32,32,.4) 40%,transparent 70%);filter:blur(3px);animation:lbg 1.5s ease-in-out infinite}

@keyframes bn{0%{background-position:0 0}17%{background-position:-30px -15px}33%{background-position:15px -30px}50%{background-position:-15px 15px}67%{background-position:30px 30px}83%{background-position:-10px 20px}to{background-position:20px -10px}}

.gallery-wrap{position:relative;z-index:1;width:100%;max-width:1000px;margin:0 auto;padding:0 clamp(12px,3vw,30px) clamp(30px,6vw,70px)}

.grid-master{display:flex;flex-direction:column;gap:var(--gap)}

.g-row{display:grid;grid-template-columns:2fr 3fr;grid-template-rows:220px 220px;gap:var(--gap)}
.g-row .g-item.vi{grid-column:1;grid-row:1/3}
.g-row.rev{grid-template-columns:3fr 2fr}
.g-row.rev .g-item.vi{grid-column:2;grid-row:1/3}
.g-row.rev .g-item.hi:nth-child(2){grid-column:1;grid-row:1}
.g-row.rev .g-item.hi:nth-child(3){grid-column:1;grid-row:2}

.g-item{position:relative;overflow:hidden;cursor:pointer;background:#111;display:block;border:0;outline:none}
.g-item.vi{grid-row:1/3}
.g-item.hi{grid-row:span 1}

.g-item img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) brightness(.7);transition:filter .45s ease,transform .5s ease,opacity .4s ease;will-change:filter,transform;opacity:0}
.g-item img.loaded{opacity:1}
.g-item:hover img,.g-item:focus-visible img{filter:grayscale(0) brightness(1);transform:scale(1.04)}

.g-item::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 100%);transition:opacity .4s ease;opacity:1;pointer-events:none}

.g-item .glow-frame{position:absolute;inset:0;border:1px solid rgba(212,32,32,0);box-shadow:inset 0 0 0 rgba(212,32,32,0);transition:border-color .4s,box-shadow .4s;pointer-events:none;z-index:2}

.g-item:hover .scan-line,.g-item:focus-visible .scan-line{opacity:1;animation-play-state:running}

.g-item:focus-visible{outline:2px solid var(--r);outline-offset:2px}

      <img data-src="https://i.ibb.co/TqmtTqRs/KUMAMOTO-2024.jpg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="MAN1K first ever live set in Kumamoto Japan early 2024" loading="lazy" decoding="async" class="lazy" width="800" height="533">
      <div class="glow-frame" aria-hidden="true"></div>
      <div class="scan-line" aria-hidden="true"></div>

<div class="press-bar">
  <a href="/press" class="press-btn" aria-label="Download MAN1K press photos in high resolution">

    <span>High-resolution images for media use →</span>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
  <div class="lb-bg" id="lb-bg"></div>
  <button class="lb-close" id="lb-close" aria-label="Close photo viewer">✕</button>
  <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous photo">←</button>
  <div class="lb-inner">
    <div class="lb-img-wrap">
      <img id="lb-img" src="" alt="" loading="eager" decoding="async">
      <div class="lb-vhs-scan" aria-hidden="true"></div>
    </div>
    <div class="lb-counter" id="lb-counter" aria-live="polite"></div>
  </div>
  <button class="lb-nav lb-next" id="lb-next" aria-label="Next photo">→</button>
</div>

<script>
(function(){
  var lbBar=document.getElementById('lb'),p=0,iv=null;
  function go(){lbBar.classList.add('on');p=0;lbBar.style.width='0';iv=setInterval(function(){if(p<70)p+=Math.random()*10;else if(p<90)p+=Math.random()*3;else if(p<95)p+=.5;lbBar.style.width=Math.min(p,95)+'%';if(p>=95)clearInterval(iv)},100)}
  function done(){clearInterval(iv);lbBar.style.width='100%';setTimeout(function(){lbBar.classList.remove('on');setTimeout(function(){lbBar.style.width='0'},300)},200)}
  go();window.addEventListener('load',done);window.addEventListener('pageshow',function(e){if(e.persisted)done()});
  document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a||a.target==='_blank')return;if(a.hostname&&a.hostname!==location.hostname)return;var h=a.getAttribute('href')||'';if(h==='#'||h.startsWith('#'))return;go()});
})();

(function(){
  var bg=document.querySelectorAll('.bg-g,.bg-n,.bg-h,.jp');
  function pause(){bg.forEach(function(el){el.style.animationPlayState='paused';el.querySelectorAll('*').forEach(function(c){c.style.animationPlayState='paused'})})}
  function resume(){bg.forEach(function(el){el.style.animationPlayState='running';el.querySelectorAll('*').forEach(function(c){c.style.animationPlayState='running'})})}
  document.addEventListener('visibilitychange',function(){document.hidden?pause():resume()});
})();

(function(){
  var bar=document.getElementById('img-lb');
  var imgs=Array.from(document.querySelectorAll('img.lazy'));
  var total=imgs.length;
  var loaded=0;

  if(total===0){return}
  if(bar){bar.classList.add('on');bar.style.width='2%'}

  function tick(){
    loaded++;
    if(bar){
      var pct=Math.round(2+(loaded/total)*98);
      bar.style.width=Math.min(pct,100)+'%';
      if(loaded>=total){
        setTimeout(function(){
          bar.classList.remove('on');
          setTimeout(function(){bar.style.width='0'},350);
        },280);
      }
    }
  }

  function loadImg(img){
    var s=img.dataset.src;
    if(!s)return;
    var done=function(){
      img.classList.add('loaded');
      img.removeAttribute('data-src');
      tick();
    };
    img.decoding='async';
    img.src=s;
    if(img.decode){img.decode().catch(function(){}).finally(done)}
    else{
      if(img.complete){done()}
      else{img.addEventListener('load',done,{once:true});img.addEventListener('error',done,{once:true})}
    }
  };

  var conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  var isSlow=conn&&(conn.effectiveType==='slow-2g'||conn.effectiveType==='2g'||conn.saveData);
  var margin=isSlow?'150px 0px':'600px 0px';
  var BATCH=isSlow?2:4;

  var queue=[];
  var inFlight=0;

  function flush(){
    while(inFlight<BATCH&&queue.length){
      var img=queue.shift();
      inFlight++;
      (function(im){
        var s=im.dataset.src;
        if(!s){inFlight--;flush();return}
        var done=function(){
          im.classList.add('loaded');
          im.removeAttribute('data-src');
          tick();
          inFlight--;
          flush();
        };
        im.decoding='async';
        im.src=s;
        if(im.decode){im.decode().catch(function(){}).finally(done)}
        else{
          if(im.complete){done()}
          else{im.addEventListener('load',done,{once:true});im.addEventListener('error',done,{once:true})}
        }
      })(img);
    }
  }

  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting)return;
      io.unobserve(e.target);
      queue.push(e.target);
      flush();
    });
  },{rootMargin:margin,threshold:0});

  imgs.forEach(function(img){io.observe(img)});
})();

(function(){
  var items=Array.from(document.querySelectorAll('.g-item[data-src]'));
  var lb=document.getElementById('lightbox');
  var lbImg=document.getElementById('lb-img');
  var lbCounter=document.getElementById('lb-counter');
  var lbBg=document.getElementById('lb-bg');
  var lbClose=document.getElementById('lb-close');
  var lbPrev=document.getElementById('lb-prev');
  var lbNext=document.getElementById('lb-next');
  var current=0;
  var isOpen=false;
  var prevFocus=null;

  function preloadAdj(idx){
    [idx-1,idx+1].forEach(function(i){
      if(i>=0&&i<items.length){
        var s=items[i].dataset.src;
        if(s){var im=new Image();im.src=s;}
      }
    });
  }

  function open(idx){
    current=idx;
    isOpen=true;
    prevFocus=document.activeElement;
    lb.classList.add('open');
    lb.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
    show(idx);
    lbClose.focus();
  }

  function show(idx){
    current=idx;
    var item=items[idx];
    lbImg.classList.add('loading');
    lbImg.alt=item.dataset.alt||'';
    lbCounter.textContent=(idx+1)+' / '+items.length;
    var newImg=new Image();
    newImg.onload=function(){lbImg.src=newImg.src;lbImg.classList.remove('loading')};
    newImg.onerror=function(){lbImg.src=item.dataset.src;lbImg.classList.remove('loading')};
    newImg.src=item.dataset.src;
    preloadAdj(idx);
  }

  function close(){
    isOpen=false;
    lb.classList.remove('open');
    lb.setAttribute('aria-hidden','true');
    document.body.style.overflow='';
    if(prevFocus)prevFocus.focus();
  }

  function prev(){if(current>0)show(current-1);else show(items.length-1)}
  function next(){if(current<items.length-1)show(current+1);else show(0)}

  items.forEach(function(item,i){
    item.addEventListener('click',function(){open(i)});
    item.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open(i)}});
  });

  lbBg.addEventListener('click',close);
  lbClose.addEventListener('click',close);
  lbPrev.addEventListener('click',function(e){e.stopPropagation();prev()});
  lbNext.addEventListener('click',function(e){e.stopPropagation();next()});

  document.addEventListener('keydown',function(e){
    if(!isOpen)return;
    if(e.key==='Escape')close();
    else if(e.key==='ArrowLeft')prev();
    else if(e.key==='ArrowRight')next();
  });

  var touchStartX=0;
  lb.addEventListener('touchstart',function(e){touchStartX=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-touchStartX;
    if(Math.abs(dx)>50){if(dx<0)next();else prev()}
  },{passive:true});
})();
</script>
<script src="/global.js" defer></script>
