      animation: grainFlicker .16s steps(1) infinite;
      contain: paint;

    @keyframes grainFlicker {
      0% {
        background-position: 0 0;
      }

      12% {

      }

      24% {
        background-position: 22px -41px;

      36% {

      84% {
        background-position: -46px -35px;
      }

      100% {
        background-position: 33px 6px;
      }

    .glitch-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: screen;
    }

    .vhs-filter {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      background: radial-gradient(ellipse at 50% 50%, transparent 62%, rgba(0, 0, 0, .3) 100%);
      mix-blend-mode: multiply;
    }

    .glitch-line {
      position: absolute;
      width: 100%;
      height: 2px;
      opacity: 0;
      background: linear-gradient(90deg, var(--gl-color, #fff), transparent);
      animation: glitchLine 100ms linear;
    }

    @keyframes glitchLine {
      0% {
        transform: translateX(-100%);
        opacity: 0;
      }

      10%,
      90% {
        opacity: .35;
      }

      to {
        transform: translateX(100%);
        opacity: 0;
      }
    }

    .glitch-flash {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, .02);
      pointer-events: none;
      opacity: 0;
      z-index: 2;
      animation: flash 150ms linear;
      mix-blend-mode: screen;
    }

    @keyframes flash {

      0%,
      to {
        opacity: 0;
      }

      50% {
        opacity: .15;
      }
    }

    .fx-tracking {
      position: fixed;
      left: 0;
      top: -6px;
      width: 100%;
      height: 6px;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(90deg, transparent 5%, rgba(255, 255, 255, .025) 40%, rgba(181, 38, 38, .05) 50%, rgba(255, 255, 255, .025) 60%, transparent 95%);
      animation: trackSweep 9s linear infinite;
    }

    @keyframes trackSweep {
      0% {
        transform: translateY(0);
        opacity: 0;
      }

      3% {
        opacity: .18;
      }

      96% {
        opacity: .18;
      }

      100% {
        transform: translateY(calc(100vh + 12px));
        opacity: 0;
      }
    }

    .fx-tearline {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 2px;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      background: rgba(255, 255, 255, .1);
      animation: tearFlash 5.5s step-end infinite;
    }

    @keyframes tearFlash {

      0%,
      100% {
        opacity: 0;
        transform: translateY(30vh);
      }

      31% {
        opacity: 0;
      }

      32% {
        opacity: .3;
        transform: translateY(62vh);
      }

      34% {
        opacity: 0;
      }

      70% {
        opacity: 0;
      }

      71% {
        opacity: .3;
        transform: translateY(18vh);

      73% {

  <script>
    (function () {
      'use strict';
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
      var isPageVisible = true;
      document.addEventListener('visibilitychange', function () { isPageVisible = !document.hidden; });

      var glitchContainer = document.getElementById('glitch-container');
      var createGlitchLine = function () {
        if (!isPageVisible) return;
        var l = document.createElement('div');
        l.className = 'glitch-line';
        l.style.top = Math.random() * 100 + '%';
        l.style.setProperty('--gl-color', Math.random() > .5 ? 'var(--red)' : '#fff');

      };
      var createFlash = function () {
        if (!isPageVisible) return;
        var f = document.createElement('div');
        f.className = 'glitch-flash';
        document.body.appendChild(f);
        setTimeout(function () { f.remove(); }, 150);
      };
      if (!reduced) {
        var lastTime = 0, minInterval = 16.67, animId = 0;
        var animate = function (t) {
          if (t - lastTime >= minInterval && isPageVisible) {
            if (Math.random() < .035) createGlitchLine();
            if (Math.random() < .015) createFlash();
            lastTime = t;
          }
          animId = requestAnimationFrame(animate);
        };
        animId = requestAnimationFrame(animate);
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) cancelAnimationFrame(animId);
          else animId = requestAnimationFrame(animate);
        });

    })();
