<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PORTAL ∆ 666</title>
  <meta name="theme-color" content="#000000">
  <style>
    html,body{height:100%;margin:0;background:#000;overflow:hidden}
    body{font:14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;color:#fff}
    a{text-decoration:none;color:#888}
    .back{
      position:fixed; top:14px; left:14px; z-index:20;
      padding:6px 8px; background:transparent; letter-spacing:.08em;
      transition:.2s; font-size:12px; border-radius:8px;
      color:#888; opacity:.7;
    }
    .back:hover{ opacity:1; text-shadow:0 0 6px rgba(255,255,255,.15) }
    #gl{position:fixed;inset:0;z-index:0;display:block}
    #fx{position:fixed;inset:0;z-index:5;pointer-events:none}
    #sigil{position:fixed;inset:0;z-index:10;display:grid;place-items:center;pointer-events:none;mix-blend-mode:screen}
    #sigil svg{width:min(70vmin,900px);filter:drop-shadow(0 0 10px #f00)}
    .chant{
      position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
      z-index:15; letter-spacing:.3em; color:rgba(255,0,0,.85);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-shadow:0 0 8px rgba(255,0,0,.6);
      user-select:none; pointer-events:none;
    }
    @media (prefers-reduced-motion: reduce){
      *{animation:none !important; transition:none !important}
    }
    .sc-hidden{
      position:absolute; width:0;height:0; opacity:0; pointer-events:none; left:-9999px; top:-9999px;
    }
  </style>
</head>
<body>
  <a class="back" href="./index">BACK</a>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>

    /* Hidden SoundCloud player (autoplay) */
    .sc-hidden{
      position: absolute; width:0;height:0; opacity:0; pointer-events:none; left:-9999px; top:-9999px;
    }
  </style>
</head>
<body>
  <a class="back" href="./index">BACK</a>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>

  <!-- Hidden SoundCloud player -->
  <iframe class="sc-hidden" allow="autoplay"
    src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/mytischi/perseus&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false">
  </iframe>

  <div id="sigil" aria-hidden="true">
    <svg viewBox="0 0 1000 1000">
      <defs>
        <radialGradient id="g" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stop-color="#ff1a1a" stop-opacity="0.9"/>
          <stop offset="50%" stop-color="#d10000" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="500" cy="500" r="420" fill="url(#g)" opacity="0.35"/>
      <circle cx="500" cy="500" r="360" fill="none" stroke="#f00" stroke-width="2"/>
      <circle cx="500" cy="500" r="240" fill="none" stroke="#f00" stroke-width="1.5" opacity="0.9"/>
      <circle cx="500" cy="500" r="120" fill="none" stroke="#f00" stroke-width="1.25" opacity="0.8"/>
      <path d="M500 170 L790 730 L210 730 Z" fill="none" stroke="#f00" stroke-width="1.6"/>
      <g opacity="0.9" stroke="#f00" stroke-width="1.1">
        <line x1="500" y1="140" x2="500" y2="860"/>
        <line x1="140" y1="500" x2="860" y2="500"/>
        <line x1="230" y1="230" x2="770" y2="770"/>
        <line x1="230" y1="770" x2="770" y2="230"/>
      </g>
      <g font-family="ui-monospace,monospace" font-size="22" fill="#ff2222">
        <text x="480" y="105">ᚠ</text>
        <text x="875" y="510">ᚨ</text>
        <text x="480" y="905">ᛞ</text>
        <text x="120" y="510">ᚱ</text>
        <text x="770" y="250">ᛟ</text>
        <text x="230" y="250">ᚾ</text>
        <text x="770" y="770">ᚷ</text>
        <text x="230" y="770">ᚹ</text>
      </g>
      <path d="M500 260 L590 500 L500 740 L410 500 Z" fill="none" stroke="#f00" stroke-width="2"/>
      <circle cx="500" cy="500" r="6" fill="#f00"/>
    </svg>
  </div>

  <div class="chant" id="chant">ᛞ ∴ ᛟ ∴ ᚱ ∴ ᚦ ∴ ᚨ ∴ ᚠ ∴ ᚾ</div>

  <script>
  // disable strobe on touch devices
  const isMobile = matchMedia('(pointer:coarse)').matches || /Mobi|Android/i.test(navigator.userAgent);

  (function(){
    const canvas = document.getElementById('gl');
    const gl = canvas.getContext('webgl');
    if(!gl){ return; }

    function resize(){
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = Math.floor(innerWidth * dpr);
      const h = Math.floor(innerHeight * dpr);
      canvas.width = w; canvas.height = h;
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      gl.viewport(0,0,w,h);
    }
    addEventListener('resize', resize, {passive:true});
    resize();

    const vertSrc = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
    const fragSrc = `precision highp float;
      uniform vec2 u_res; uniform float u_time; uniform vec2 u_mouse;
      uniform float u_glitch; uniform float u_strobe;

      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p){ vec2 i=floor(p), f=fract(p);
        float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));
        vec2 u=f*f*(3.0-2.0*f); return mix(a,b,u.x) + (c-a)*u.y*(1.0-u.x) + (d-b)*u.x*u.y; }
      float fbm(vec2 p){ float v=0.0; float a=0.5; for(int i=0;i<6;i++){ v+=a*noise(p); p*=2.0; a*=0.5; } return v; }
      float sdCircle(vec2 p, float r){ return length(p)-r; }
      mat2 rot(float a){ float s=sin(a), c=cos(a); return mat2(c,-s,s,c); }

      void main(){
        vec2 uv=(gl_FragCoord.xy/u_res.xy)*2.0-1.0;
        uv.x*=u_res.x/u_res.y;

        // mouse in NDC
        vec2 m=(u_mouse/u_res)*2.0-1.0;
        m.x*=u_res.x/u_res.y;

        // === smoke field (follows mouse) ===
        // move noise center with mouse and add slow drift
        vec2 smokeUV = (uv - m*0.45) * 1.6;
        float t = u_time*0.2;
        float n = fbm(smokeUV + vec2(t, -t*0.7));
        float smoke = smoothstep(0.2, 1.0, n);    // mask for smoke intensity

        // soft red base
        vec3 col = vec3(0.0);
        col.r += smoke * 0.85;

        // mild glitch (like first version): subtle stripes and small chroma shift
        float stripes = step(0.96, fract(uv.y*60.0 + u_time*10.0)) * 0.18;
        float gshift = u_glitch * (noise(vec2(uv.y*40.0, u_time*4.0))*2.0-1.0) * 0.02;
        col.r += stripes;
        col.g += fbm(smokeUV + vec2(0.3,-0.2) + gshift) * 0.25;
        col.b += fbm(smokeUV - vec2(0.2,0.5) - gshift) * 0.18;

        // rotating sigil wells (subtle)
        float circle=smoothstep(0.52,0.5, abs(sdCircle(uv*rot(u_time*0.2), 0.5)));
        float inner =smoothstep(0.27,0.25, abs(sdCircle((uv+0.001*noise(uv*30.0))*rot(-u_time*0.33), 0.25)));
        float sig=clamp(circle + inner, 0.0, 1.0);
        col.r += sig * 0.45;

        // === strobe affects ONLY smoke (red↔white) when mouse held ===
        if(u_strobe > 0.5){
          // fast 30Hz toggle
          float phase = step(0.5, fract(u_time*30.0));
          vec3 white = vec3(1.0);
          vec3 red   = vec3(1.0, 0.18, 0.18);
          vec3 target = mix(red, white, phase);
          // mix only in smoke areas
          col = mix(col, target, clamp(smoke, 0.0, 1.0));
        }

        // vignette & bias
        col = vec3(col.r*1.15, col.g*0.2, col.b*0.2);
        float vig = smoothstep(1.2, 0.2, length(uv)); col *= vig;
        col = pow(col, vec3(0.96));

        gl_FragColor = vec4(col, 1.0);
      }`;

    function compile(type, src){
      const s=gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s)); }
      return s;
    }
    const vs=compile(gl.VERTEX_SHADER, vertSrc);
    const fs=compile(gl.FRAGMENT_SHADER, fragSrc);
    const prog=gl.createProgram(); gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
    gl.useProgram(prog);

    const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

    const u_res=gl.getUniformLocation(prog,'u_res');
    const u_time=gl.getUniformLocation(prog,'u_time');
    const u_mouse=gl.getUniformLocation(prog,'u_mouse');
    const u_glitch=gl.getUniformLocation(prog,'u_glitch');
    const u_strobe=gl.getUniformLocation(prog,'u_strobe');

    let start=performance.now();
    let mouse=[0,0];
    let glitch=0.25;   // baseline mild glitch
    let strobe=0.0;

    addEventListener('mousemove', e=>{ mouse=[e.clientX*devicePixelRatio,(innerHeight-e.clientY)*devicePixelRatio]; }, {passive:true});
    addEventListener('touchmove', e=>{
      const t=e.touches[0]; if(t) mouse=[t.clientX*devicePixelRatio,(innerHeight-t.clientY)*devicePixelRatio];
    }, {passive:true});

    if(!isMobile){
      addEventListener('mousedown', ()=>{ strobe=1.0; }, {passive:true});
      addEventListener('mouseup',   ()=>{ strobe=0.0; }, {passive:true});
      addEventListener('mouseleave',()=>{ strobe=0.0; }, {passive:true});
    }

    function draw(){
      const t=(performance.now()-start)/1000;
      // slight breathing of glitch value (very subtle)
      const g = glitch * (0.9 + 0.1 * Math.sin(t*0.7));

      gl.uniform2f(u_res, canvas.width, canvas.height);
      gl.uniform1f(u_time, t);
      gl.uniform2f(u_mouse, mouse[0], mouse[1]);
      gl.uniform1f(u_glitch, g);
      gl.uniform1f(u_strobe, strobe);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(draw);
    }
    draw();
  })();

  // FX layer (runes) kept as before
  (function(){
    const c=document.getElementById('fx'); const ctx=c.getContext('2d');
    function resize(){ const dpr=Math.min(2,devicePixelRatio||1); c.width=innerWidth*dpr; c.height=innerHeight*dpr; c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); }
    addEventListener('resize', resize, {passive:true}); resize();
    const glyphs='ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛇ ᛈ ᛉ ᛋ ᛏ ᛒ ᛗ ᛚ ᛝ ᛟ ∴ † ∵ △ ▽ ◯ ☽ ☾ ᛞ'.split(' ');
    const drops=Array.from({length:60},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,v:0.6+Math.random()*1.8,s:12+Math.random()*18,ch:glyphs[(Math.random()*glyphs.length)|0],a:0.5+Math.random()*0.5}));
    function step(){
      ctx.clearRect(0,0,innerWidth,innerHeight);
      for(const d of drops){
        ctx.fillStyle=`rgba(255,0,0,${d.a})`; ctx.font=`${d.s}px ui-monospace,monospace`; ctx.fillText(d.ch,d.x,d.y);
        d.y+=d.v; if(d.y>innerHeight+40){ d.y=-20; d.x=Math.random()*innerWidth; d.v=0.6+Math.random()*1.8; d.s=12+Math.random()*18; d.ch=glyphs[(Math.random()*glyphs.length)|0]; }
      }
      requestAnimationFrame(step);
    }
    step();
  })();

  // Runes text — faster cycle remains
  (function(){
    const el=document.getElementById('chant');
    const seq=[
      'ᚠᚢᚦ ∴ ᛞᛟᚱ ∴ ᚨᚾᚠ',
      'ᛉᛉᛉ ∴ ᚹᚺᛁᛏᚳ ∴ ᚻᚩᚢᛋᛖ',
      'ᛞ ∴ ᛟ ∴ ᚱ ∴ ᚦ ∴ ᚨ ∴ ᚠ ∴ ᚾ',
      '∴ ᛞᛖᚨᛞᚱᚨᛉ ∴ ᛗᚨᚾ1ᚳ',
      'ᚹᛁᛏᚳᚺ ∴ ᛞᚨᚱᚳᚹᚨᚢᛖ',
      'ᛗᚨᚾᛁᚳ ∴ ᚲᛁᛉᛁᛚ ∴ ᛋᚺᚨᛞᛟᚹ'
    ];
    let i=0; setInterval(()=>{ i=(i+1)%seq.length; el.textContent=seq[i]; }, 200);
  })();
  </script>

</body>
</html>
